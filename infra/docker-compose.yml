# Local infrastructure for MSclips Maker development.
#   docker compose -f infra/docker-compose.yml up -d
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: msclips
      POSTGRES_PASSWORD: msclips
      POSTGRES_DB: msclips
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U msclips"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7
    ports: ["6379:6379"]

  # Optional S3-compatible storage. Set MSCLIPS_STORAGE_BACKEND=s3 to use it.
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: msclips
      MINIO_ROOT_PASSWORD: msclips-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]

volumes:
  pgdata:
  miniodata:
